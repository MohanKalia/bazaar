spring.application.name=bazaar
# this is gonna be the mysql database connection
spring.datasource.url=jdbc:mysql://localhost:3306/bazaar_db
spring.datasource.username=springstudent
spring.datasource.password=SpringStudent@1

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

# shows us the generated SQL
spring.jpa.show-sql=true
# and the ORM equivalent
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update
